name: Build Teacher Attendance Admin APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -o Teacher_Attendance_Admin_App.zip -d extracted

          echo "===== EXTRACTED FILES ====="
          find extracted -maxdepth 5 -type f | head -200

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Enable AndroidX
        run: |
          PROJECT_DIR=$(find extracted -name "settings.gradle" -o -name "settings.gradle.kts" | head -1 | xargs dirname)

          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo "android.useAndroidX=true" >> "$PROJECT_DIR/gradle.properties"
          echo "android.enableJetifier=true" >> "$PROJECT_DIR/gradle.properties"
          echo "kotlin.version=1.8.22" >> "$PROJECT_DIR/gradle.properties"

      - name: Build APK
        run: |
          PROJECT_DIR=$(find extracted -name "settings.gradle" -o -name "settings.gradle.kts" | head -1 | xargs dirname)

          echo "Building project from:"
          echo "$PROJECT_DIR"

          cd "$PROJECT_DIR"

          gradle assembleDebug --no-daemon

      - name: Find APK
        run: |
          echo "===== APK FILES ====="
          find extracted -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Teacher-Attendance-Admin-APK
          path: extracted/**/*.apk
