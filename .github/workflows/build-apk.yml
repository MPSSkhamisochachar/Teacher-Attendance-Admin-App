name: Build Teacher Attendance Admin APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -o Teacher_Attendance_Admin_App.zip -d extracted
          echo "Project extracted:"
          find extracted -maxdepth 3 -type f | head -100

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Enable AndroidX
        run: |
          echo "android.useAndroidX=true" >> extracted/gradle.properties
          echo "android.enableJetifier=true" >> extracted/gradle.properties

      - name: Build APK
        run: |
          cd extracted
          gradle assembleDebug --no-daemon

      - name: Find APK
        run: |
          find extracted -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Teacher-Attendance-Admin-APK
          path: extracted/**/*.apk
