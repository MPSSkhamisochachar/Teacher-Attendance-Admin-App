name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip project (auto-detect zip name)
        run: |
          ZIPFILE=$(ls *.zip | head -n 1)
          echo "Found zip: $ZIPFILE"
          unzip -o "$ZIPFILE" -d extracted
          ls -la extracted
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Make gradlew executable
        working-directory: extracted/Teacher_Attendance_Admin_App
        run: chmod +x gradlew || true
      - name: Build debug APK
        working-directory: extracted/Teacher_Attendance_Admin_App
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Attendance-Admin-APK
          path: extracted/Teacher_Attendance_Admin_App/app/build/outputs/apk/debug/app-debug.apk
